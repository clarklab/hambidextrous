<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff9ecf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Hambidextrous</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#ffd6ec;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #namebox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(43,29,46,0.45);z-index:10;font-family:"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;touch-action:manipulation}
  #namebox[hidden]{display:none}
  #namebox .card{background:#fff;border:5px solid #2b1d2e;border-radius:30px;box-shadow:0 8px 0 #2b1d2e;padding:26px 24px 22px;width:min(86vw,340px);text-align:center;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
  #namebox .hands{font-size:44px;line-height:1;margin-bottom:6px}
  #namebox h1{margin:0;font-size:22px;color:#ff5c8a;letter-spacing:.5px}
  #namebox p{margin:6px 0 14px;color:#2b1d2e;font-size:17px}
  #nameinput{display:block;width:100%;box-sizing:border-box;font:700 22px inherit;text-align:center;padding:12px;border:4px solid #2b1d2e;border-radius:18px;background:#fff8fb;color:#2b1d2e;outline:none;-webkit-user-select:text;user-select:text}
  #nameinput:focus{border-color:#ff5c8a;background:#fff}
  #namego{margin-top:14px;width:100%;font:700 22px inherit;color:#fff;background:#ff5c8a;border:4px solid #2b1d2e;border-radius:999px;padding:12px;box-shadow:0 5px 0 #2b1d2e;-webkit-text-stroke:1px #2b1d2e}
  #namego:active{transform:translateY(3px);box-shadow:0 2px 0 #2b1d2e}
  #namebox small{display:block;margin-top:10px;color:#2b1d2e;opacity:.6;font-size:12px}
  #namecancel{margin-top:10px;background:none;border:0;color:#2b1d2e;opacity:.6;font:600 14px inherit;padding:6px 10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="namebox" hidden>
  <form class="card" id="nameform" autocomplete="off">
    <div class="hands">🫲 🫱</div>
    <h1>HAMBIDEXTROUS</h1>
    <p>What's your name, champ?</p>
    <input id="nameinput" maxlength="12" placeholder="your name" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="go" inputmode="text">
    <button id="namego" type="submit">LET'S GO!</button>
    <small>Your name goes on the world records board 🌍</small>
    <button id="namecancel" type="button">← back</button>
  </form>
</div>
<script>
'use strict';
/* =====================================================================
   HAMBIDEXTROUS!  — a kawaii WarioWare-style ambidextrous trainer
   Every mini game is played twice: once LEFT hand, once RIGHT hand.
   The hand with more wins is the CHAMPION HAND. Sessions run < 2 min.
   ===================================================================== */

// ---------- tiny utils ----------
const TAU = Math.PI * 2;
const R = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const RI = (a, b) => Math.floor(R(a, b + 1));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeOutBack = t => { t = clamp(t, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return dist(px, py, ax + dx * t, ay + dy * t);
}

const FONT = '"Fredoka","Baloo 2","Nunito","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif';
const INK = '#2b1d2e';
const PAL = ['#ff8ac2', '#7ed6ff', '#ffd23f', '#9ef29e', '#c79cff', '#ff9d6b'];
const HAND_COL = { L: '#5fb8ff', R: '#ff7cc0' };
const HAND_NAME = { L: 'LEFT', R: 'RIGHT' };
const GAMES_PER_SESSION = 6;   // 6 games x 2 hands keeps a session under 2 minutes
let TOP = 0, BOT = 0, HUD = 104;   // safe-area insets + HUD height (recomputed on resize)

// ---------- canvas ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  try { const cs = getComputedStyle(document.body); TOP = parseFloat(cs.getPropertyValue('--sat')) || 0; BOT = parseFloat(cs.getPropertyValue('--sab')) || 0; } catch (_) { TOP = 0; BOT = 0; }
  HUD = TOP + 104;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();
function pa() { return { x: 0, y: HUD, w: W, h: H - HUD - 18 - BOT }; }

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.closePath(); }
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.closePath(); }
function txt(s, x, y, size, o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 700} ${size}px ${FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.rot) { ctx.translate(x, y); ctx.rotate(o.rot); x = 0; y = 0; }
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || size * 0.2; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(s, x, y);
  ctx.restore();
}
// kawaii face. moods: happy, joy, o, dizzy, sad, sleepy, w (cat)
function face(x, y, s, mood = 'happy') {
  ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const ex = s * 0.42, ey = -s * 0.08, er = Math.max(2, s * 0.11);
  ctx.lineWidth = Math.max(2, s * 0.075); ctx.strokeStyle = INK;
  ctx.fillStyle = 'rgba(255,110,160,0.45)';
  circle(-ex * 1.55, ey + s * 0.2, s * 0.15); ctx.fill(); circle(ex * 1.55, ey + s * 0.2, s * 0.15); ctx.fill();
  ctx.fillStyle = INK;
  for (const sx of [-1, 1]) {
    if (mood === 'joy') { ctx.beginPath(); ctx.arc(sx * ex, ey + er, er * 1.4, Math.PI, TAU); ctx.stroke(); }
    else if (mood === 'sleepy') { ctx.beginPath(); ctx.arc(sx * ex, ey - er, er * 1.4, 0, Math.PI); ctx.stroke(); }
    else if (mood === 'dizzy') { const k = er * 1.2; ctx.beginPath(); ctx.moveTo(sx * ex - k, ey - k); ctx.lineTo(sx * ex + k, ey + k); ctx.moveTo(sx * ex + k, ey - k); ctx.lineTo(sx * ex - k, ey + k); ctx.stroke(); }
    else { circle(sx * ex, ey, er); ctx.fill(); ctx.fillStyle = '#fff'; circle(sx * ex - er * 0.35, ey - er * 0.35, er * 0.35); ctx.fill(); ctx.fillStyle = INK; }
  }
  ctx.beginPath();
  if (mood === 'happy') { ctx.arc(0, ey + s * 0.16, s * 0.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  else if (mood === 'joy') { ctx.arc(0, ey + s * 0.18, s * 0.22, 0, Math.PI); ctx.closePath(); ctx.fillStyle = '#ff5c8a'; ctx.fill(); ctx.stroke(); }
  else if (mood === 'o') { circle(0, ey + s * 0.28, s * 0.1); ctx.fill(); }
  else if (mood === 'sad' || mood === 'dizzy') { ctx.arc(0, ey + s * 0.42, s * 0.16, 1.2 * Math.PI, 1.8 * Math.PI); ctx.stroke(); }
  else if (mood === 'sleepy') { ctx.arc(0, ey + s * 0.16, s * 0.12, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
  else if (mood === 'w') { ctx.moveTo(-s * 0.2, ey + s * 0.2); ctx.quadraticCurveTo(-s * 0.1, ey + s * 0.34, 0, ey + s * 0.2); ctx.quadraticCurveTo(s * 0.1, ey + s * 0.34, s * 0.2, ey + s * 0.2); ctx.stroke(); }
  ctx.restore();
}
// cute hand with a face. side 'L' or 'R'. s = palm width
function hand(x, y, s, side, mood = 'happy', col = '#ffd9b3', wave = 0) {
  ctx.save(); ctx.translate(x, y); if (side === 'R') ctx.scale(-1, 1); ctx.rotate(wave);
  const pw = s, ph = s * 0.98, fw = s * 0.23;
  const fx = [-0.36, -0.12, 0.12, 0.36], fh = [0.5, 0.7, 0.66, 0.46];
  const shapes = [];
  for (let i = 0; i < 4; i++) shapes.push(() => rr(fx[i] * pw - fw / 2, -ph / 2 - fh[i] * s, fw, fh[i] * s + s * 0.35, fw / 2));
  shapes.push(() => { ctx.save(); ctx.translate(pw * 0.52, -ph * 0.12); ctx.rotate(-0.95); rr(-fw / 2, -s * 0.55, fw, s * 0.7, fw / 2); ctx.restore(); });
  shapes.push(() => rr(-pw / 2, -ph / 2, pw, ph, s * 0.3));
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, s * 0.12); ctx.strokeStyle = INK;
  for (const sh of shapes) { sh(); ctx.stroke(); }
  ctx.fillStyle = col; for (const sh of shapes) { sh(); ctx.fill(); }
  if (side === 'R') { ctx.scale(-1, 1); } // un-mirror so the face isn't mirrored (symmetry anyway)
  face(0, s * 0.12, s * 0.42, mood);
  ctx.restore();
}
function badge(x, y, w, h, col, label, size = 22) {
  ctx.save(); rr(x - w / 2, y - h / 2, w, h, h / 2); ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  txt(label, x, y + 1, size, { color: '#fff', stroke: INK, strokeW: size * 0.22 }); ctx.restore();
}
// pointing hand (index finger up, other fingers curled); fingertip is at (x - 0.33*s, y - 0.95*s)
function finger(x, y, s, press = 0, col = '#ffd9b3') {
  ctx.save(); ctx.translate(x, y + press * s * 0.12); ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, s * 0.1); ctx.strokeStyle = INK; ctx.fillStyle = col;
  const shapes = [
    () => rr(-s * 0.53, -s * 0.95, s * 0.4, s * 1.25, s * 0.2),                       // index finger, pointing up
    () => rr(-s * 0.6, s * 0.02, s * 1.2, s * 0.85, s * 0.32),                        // palm
    () => rr(-s * 0.12, -s * 0.2, s * 0.3, s * 0.5, s * 0.15),                         // curled middle
    () => rr(s * 0.16, -s * 0.14, s * 0.28, s * 0.46, s * 0.14),                       // curled ring
    () => rr(s * 0.4, -s * 0.04, s * 0.24, s * 0.38, s * 0.12),                        // curled pinky
    () => { ctx.save(); ctx.translate(-s * 0.55, s * 0.3); ctx.rotate(0.6); rr(-s * 0.15, -s * 0.38, s * 0.3, s * 0.5, s * 0.15); ctx.restore(); }, // thumb
  ];
  for (const f of shapes) { f(); ctx.stroke(); } for (const f of shapes) { f(); ctx.fill(); }
  ctx.strokeStyle = 'rgba(43,29,46,0.25)'; ctx.lineWidth = Math.max(2, s * 0.05); // knuckle creases
  for (const kx of [0.03, 0.3, 0.52]) { ctx.beginPath(); ctx.moveTo(kx * s - s * 0.08, s * 0.12); ctx.lineTo(kx * s + s * 0.06, s * 0.12); ctx.stroke(); }
  ctx.fillStyle = '#ffb3c6'; rr(-s * 0.44, -s * 0.89, s * 0.22, s * 0.2, s * 0.09); ctx.fill();
  ctx.restore();
}
const GCOL = { tap: '#ff5c8a', tapfast: '#ff9d6b', swipe: '#5fb8ff', trace: '#c79cff', drag: '#6fcf5a', rub: '#ffb020' };
// animated "how to touch" demo, centred on (x, y)
function gestureDemo(kind, x, y, t, s = 60, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const tip = (px, py, press) => finger(px + s * 0.33, py + s * 0.95, s, press);
  const ripple = (px, py, k) => { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; for (let i = 0; i < 2; i++) { const r = (k + i * 0.5) % 1; ctx.globalAlpha = alpha * (1 - r); ctx.beginPath(); ctx.arc(px, py, 6 + r * s * 0.8, 0, TAU); ctx.stroke(); } ctx.restore(); };
  if (kind === 'tap' || kind === 'tapfast') {
    const f = kind === 'tap' ? 1.5 : 5, ph = (t * f) % 1, press = ph < 0.3;
    if (press) ripple(x, y, 0.2 + ph / 0.3 * 0.5); tip(x, y - (press ? 0 : s * 0.3), press ? 1 : 0);
    if (kind === 'tapfast') txt('×3!', x + s * 0.85, y - s * 0.7, s * 0.4, { color: '#ffd23f', stroke: INK, rot: 0.15 });
  } else if (kind === 'swipe') {
    const ph = (t * 1.1) % 1, k = easeOut(ph), x0 = x - s, y0 = y + s * 0.5, x1 = x + s, y1 = y - s * 0.5, px = lerp(x0, x1, k), py = lerp(y0, y1, k);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(lerp(x0, x1, Math.max(0, k - 0.45)), lerp(y0, y1, Math.max(0, k - 0.45))); ctx.lineTo(px, py); ctx.stroke();
    tip(px, py, 1);
  } else if (kind === 'trace') {
    const w = s * 1.7, h = s * 1.1, per = 2 * (w + h), d = ((t * 0.4) % 1) * per;
    ctx.setLineDash([6, 8]); ctx.strokeStyle = '#ff5c8a'; ctx.lineWidth = 4; ctx.strokeRect(x - w / 2, y - h / 2, w, h); ctx.setLineDash([]);
    let px, py; if (d < w) { px = x - w / 2 + d; py = y - h / 2; } else if (d < w + h) { px = x + w / 2; py = y - h / 2 + d - w; } else if (d < 2 * w + h) { px = x + w / 2 - (d - w - h); py = y + h / 2; } else { px = x - w / 2; py = y + h / 2 - (d - 2 * w - h); }
    tip(px + s * 0.1, py + s * 0.1, 1);
  } else if (kind === 'drag') {
    const ph = (t * 0.7) % 1, k = easeOut(clamp(ph / 0.7, 0, 1)), x0 = x - s * 0.9, x1 = x + s * 0.9, px = lerp(x0, x1, k);
    ctx.setLineDash([6, 8]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(x1, y, s * 0.42, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ff8ac2'; ctx.strokeStyle = INK; ctx.lineWidth = 3; circle(px, y, s * 0.28); ctx.fill(); ctx.stroke();
    tip(px, y - s * 0.05, 1);
  } else if (kind === 'rub') {
    const px = x + Math.sin(t * 7) * s * 0.75;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x - s * 0.9, y + s * 0.6); ctx.lineTo(x + s * 0.9, y + s * 0.6); ctx.stroke();
    txt('◀', x - s * 1.1, y + s * 0.6, s * 0.32, { color: '#fff', stroke: INK }); txt('▶', x + s * 1.1, y + s * 0.6, s * 0.32, { color: '#fff', stroke: INK });
    tip(px, y, 1);
  }
  ctx.restore();
}
let shakeT = 0;
function shake(a = 0.25) { shakeT = Math.max(shakeT, a); }

// ---------- audio ----------
const AU = {
  ctx: null, master: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ctx.destination);
      const nb = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.5, this.ctx.sampleRate);
      const d = nb.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = nb;
    } catch (e) { this.ctx = null; }
  },
  now() { return this.ctx ? this.ctx.currentTime : performance.now() / 1000; },
  tone({ f = 440, f2, dur = 0.1, type = 'square', vol = 0.15, at = 0, attack = 0.005 }) {
    if (!this.ctx) return; const t = at || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur = 0.1, vol = 0.2, at = 0, hp = 800) {
    if (!this.ctx) return; const t = at || this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const fl = this.ctx.createBiquadFilter(); fl.type = 'highpass'; fl.frequency.value = hp;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.02);
  },
  tick(at, accent) {
    this.tone({ f: accent ? 1500 : 1100, f2: accent ? 900 : 800, dur: 0.05, type: 'square', vol: accent ? 0.09 : 0.05, at });
    this.noise(0.03, accent ? 0.12 : 0.06, at, 3000);
    if (accent) this.tone({ f: 200, f2: 120, dur: 0.1, type: 'sine', vol: 0.18, at });
  },
  count(n) { if (n > 0) this.tone({ f: 740, dur: 0.14, type: 'triangle', vol: 0.25 }); else { this.tone({ f: 990, dur: 0.3, type: 'triangle', vol: 0.3 }); this.tone({ f: 1480, dur: 0.3, type: 'sine', vol: 0.15 }); } },
  pop() { this.tone({ f: 500, f2: 1300, dur: 0.08, type: 'square', vol: 0.12 }); this.noise(0.04, 0.1); },
  good() { this.tone({ f: 880, dur: 0.08, type: 'triangle', vol: 0.2 }); this.tone({ f: 1320, dur: 0.16, type: 'triangle', vol: 0.2, at: this.now() + 0.07 }); },
  great() { [880, 1108, 1320, 1760].forEach((f, i) => this.tone({ f, dur: 0.14, type: 'triangle', vol: 0.2, at: this.now() + i * 0.06 })); },
  bad() { this.tone({ f: 180, f2: 90, dur: 0.22, type: 'sawtooth', vol: 0.14 }); },
  swish() { this.noise(0.12, 0.25, 0, 1500); },
  snip() { this.noise(0.05, 0.18, 0, 4000); this.tone({ f: 2200, f2: 1600, dur: 0.04, type: 'square', vol: 0.05 }); },
  purr() { this.tone({ f: 120 + R(20), f2: 90, dur: 0.12, type: 'sawtooth', vol: 0.08 }); this.tone({ f: 1200 + R(400), dur: 0.05, type: 'sine', vol: 0.06 }); },
  pump(n) { this.tone({ f: 300 + n * 14, f2: 380 + n * 14, dur: 0.09, type: 'square', vol: 0.1 }); this.noise(0.08, 0.12, 0, 600); },
  splat() { this.tone({ f: 260, f2: 110, dur: 0.15, type: 'triangle', vol: 0.18 }); this.noise(0.08, 0.1, 0, 300); },
  jingle(win) {
    const seq = win ? [523, 659, 784, 1047, 1319] : [392, 392, 370, 349];
    seq.forEach((f, i) => { this.tone({ f, dur: win ? 0.18 : 0.25, type: 'triangle', vol: 0.22, at: this.now() + i * (win ? 0.1 : 0.16) }); this.tone({ f: f / 2, dur: 0.2, type: 'square', vol: 0.06, at: this.now() + i * (win ? 0.1 : 0.16) }); });
  },
  fanfare() { [523, 659, 784, 1047, 784, 1047, 1319, 1568].forEach((f, i) => { this.tone({ f, dur: 0.22, type: 'triangle', vol: 0.22, at: this.now() + i * 0.11 }); this.tone({ f: f * 1.5, dur: 0.2, type: 'sine', vol: 0.08, at: this.now() + i * 0.11 }); }); },
};

// ---------- metronome (audio-clock scheduled, visuals follow) ----------
const Metro = {
  bpm: 126, next: 0, pending: [], count: 0, running: false, lastBeatAt: -1e9,
  start(bpm) { this.bpm = bpm; this.next = AU.now() + 0.08; this.pending = []; this.count = 0; this.running = true; },
  stop() { this.running = false; this.pending = []; },
  update() {
    if (!this.running) return 0;
    const now = AU.now(), iv = 60 / this.bpm;
    while (this.next < now + 0.15) { AU.tick(this.next, this.count % 4 === 0); this.pending.push(this.next); this.count++; this.next += iv; }
    let fired = 0;
    while (this.pending.length && this.pending[0] <= now) { this.lastBeatAt = this.pending.shift(); fired++; }
    return fired;
  },
  pulse() { const iv = 60 / this.bpm; return 1 - clamp((AU.now() - this.lastBeatAt) / iv, 0, 1); },
  sinceBeat() { return AU.now() - this.lastBeatAt; },
};

// ---------- particles ----------
const FX = {
  list: [],
  spark(x, y, col = '#ffd23f', n = 10, sp = 240) { for (let i = 0; i < n; i++) { const a = R(TAU), v = R(sp * 0.4, sp); this.list.push({ k: 's', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, life: R(0.4, 0.7), t: 0, col, sz: R(4, 10) }); } },
  text(x, y, s, col = '#fff', size = 30) { this.list.push({ k: 't', x, y, vy: -80, life: 0.85, t: 0, s, col, size }); },
  heart(x, y) { this.list.push({ k: 'h', x, y, vx: R(-50, 50), vy: -R(60, 130), life: 1.1, t: 0, sz: R(12, 24) }); },
  puff(x, y, col = '#fff', n = 6) { for (let i = 0; i < n; i++) this.list.push({ k: 'p', x: x + R(-10, 10), y: y + R(-10, 10), vx: R(-40, 40), vy: -R(20, 70), life: R(0.5, 0.9), t: 0, col, sz: R(10, 22) }); },
  confetti(n = 80) { for (let i = 0; i < n; i++) this.list.push({ k: 'c', x: R(W), y: -R(0, 200), vx: R(-60, 60), vy: R(90, 220), life: R(2.5, 4), t: 0, col: pick(PAL), sz: R(6, 12), rot: R(TAU), vr: R(-7, 7) }); },
  update(dt) {
    const L = this.list; for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i]; p.t += dt; p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt;
      if (p.k === 's') p.vy += 600 * dt; if (p.k === 'c') { p.vy += 40 * dt; p.vx += Math.sin(p.t * 5 + i) * 30 * dt; p.rot += p.vr * dt; }
      if (p.k === 'h') p.x += Math.sin(p.t * 6) * 30 * dt;
      if (p.t > p.life) L.splice(i, 1);
    }
  },
  draw() {
    for (const p of this.list) {
      const a = 1 - p.t / p.life; ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
      if (p.k === 's') { ctx.fillStyle = p.col; circle(p.x, p.y, p.sz * a); ctx.fill(); }
      else if (p.k === 'p') { ctx.fillStyle = p.col; circle(p.x, p.y, p.sz * (0.5 + a * 0.5)); ctx.fill(); }
      else if (p.k === 't') { txt(p.s, p.x, p.y, p.size * (1 + (1 - a) * 0.3), { color: p.col, stroke: INK }); }
      else if (p.k === 'h') { txt('💖', p.x, p.y, p.sz); }
      else if (p.k === 'c') { ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2); }
      ctx.restore();
    }
  },
};

// 2. DART BOARD — the board runs away, tap to throw
GAMES.push({
  id: 'dart', name: 'DIZZY DARTS', emoji: '🎯', verb: 'TAP!', gesture: 'tap', hint: 'TAP the moving bullseye!', dur: 5, bg: '#d6f2ff', unit: 'pts', max: 150,
  start() { this.t = 0; this.darts = []; this.score = 0; this.cool = 0; this.bx = W / 2; this.by = H / 2; this.mood = 'happy'; this.moodT = 0; },
  update(dt) {
    this.t += dt; this.cool -= dt; this.moodT -= dt; if (this.moodT <= 0) this.mood = 'happy';
    const a = pa(), cx = a.x + a.w / 2, cy = a.y + a.h / 2, sp = 1 + this.t * 0.18;

    else if (pts > 0) { AU.pop(); FX.text(p.x, p.y - 30, '+' + pts, '#fff'); this.mood = 'o'; this.moodT = 0.3; }

// 3. COUPON CUT — trace the dotted line
GAMES.push({
  id: 'coupon', name: 'COUPON CUT', emoji: '✂️', verb: 'TRACE!', gesture: 'trace', hint: 'Hold and TRACE the dotted line!', dur: 5.5, bg: '#ffe0ee', unit: '%', max: 100,
  start() {
    const a = pa(); const w = Math.min(a.w - 80, 330), h = Math.min(a.h - 150, 250);
    this.r = { x: a.x + (a.w - w) / 2, y: a.y + (a.h - h) / 2 - 10, w, h };
    this.pts = []; const step = 11, r = this.r;
    const edges = [[r.x, r.y, r.x + r.w, r.y], [r.x + r.w, r.y, r.x + r.w, r.y + r.h], [r.x + r.w, r.y + r.h, r.x, r.y + r.h], [r.x, r.y + r.h, r.x, r.y]];
    for (const [x1, y1, x2, y2] of edges) { const L = dist(x1, y1, x2, y2), n = Math.floor(L / step); const tx = (x2 - x1) / L, ty = (y2 - y1) / L; for (let i = 0; i < n; i++) this.pts.push({ x: x1 + tx * i * step, y: y1 + ty * i * step, tx, ty, cut: false }); }
    this.cut = 0; this.pos = null; this.down_ = false; this.snipT = 0; this.wig = 0;
  },
  update(dt) { this.snipT -= dt; this.wig += dt; },
  _cut(p) {
    let any = false; for (const q of this.pts) if (!q.cut && dist(p.x, p.y, q.x, q.y) < 30) { q.cut = true; this.cut++; any = true; if (Math.random() < 0.3) FX.spark(q.x, q.y, '#fff', 2, 90); }
    if (any && this.snipT <= 0) { AU.snip(); this.snipT = 0.09; }
  },
  down(p) { this.down_ = true; this.pos = p; this._cut(p); },
  move(p) { if (this.pos && this.down_) { const n = Math.ceil(dist(p.x, p.y, this.pos.x, this.pos.y) / 8); for (let i = 1; i <= n; i++) this._cut({ x: lerp(this.pos.x, p.x, i / n), y: lerp(this.pos.y, p.y, i / n) }); } this.pos = p; },
  up() { this.down_ = false; },
  draw() {
    const r = this.r, frac = this.cut / this.pts.length;
    ctx.save();
    // paper behind
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; rr(r.x - 40, r.y - 40, r.w + 80, r.h + 80, 20); ctx.fill();
    // coupon (wiggles when fully cut)
    const done = frac >= 0.999; const wob = done ? Math.sin(this.wig * 12) * 0.05 : 0;
    ctx.translate(r.x + r.w / 2, r.y + r.h / 2); ctx.rotate(wob); ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));
    ctx.fillStyle = '#fffbe7'; rr(r.x, r.y, r.w, r.h, 8); ctx.fill();
    ctx.fillStyle = '#ff8ac2'; rr(r.x + 12, r.y + 12, r.w - 24, 40, 10); ctx.fill();
    txt('★ COUPON ★', r.x + r.w / 2, r.y + 32, 20, { color: '#fff', stroke: INK, strokeW: 4 });
    txt('50% OFF', r.x + r.w / 2, r.y + r.h * 0.42 + 10, Math.min(56, r.w * 0.19), { color: '#ffd23f', stroke: INK, strokeW: 7 });
    txt('HUGS & HIGH-FIVES', r.x + r.w / 2, r.y + r.h * 0.42 + 52, Math.min(20, r.w * 0.065), { color: INK, weight: 500 });
    face(r.x + r.w / 2, r.y + r.h - 40, 30, done ? 'joy' : 'happy');
    // dotted line
    ctx.lineCap = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = '#ff5c8a';
    for (const q of this.pts) { if (q.cut) continue; ctx.beginPath(); ctx.moveTo(q.x - q.tx * 3, q.y - q.ty * 3); ctx.lineTo(q.x + q.tx * 3, q.y + q.ty * 3); ctx.stroke(); }
    ctx.restore();
    if (this.pos) { txt('✂️', this.pos.x + 6, this.pos.y - 14, 48, { rot: -0.6 }); }
  },
  result() { const v = Math.round(100 * this.cut / this.pts.length); return { value: v, label: v + '% cut', pct: v / 100 }; },
});

// 4. WEED WHACK — whack-a-mole with sprouting weeds
GAMES.push({
  id: 'weed', name: 'WEED WHACK', emoji: '🌱', verb: 'TAP!', gesture: 'tap', hint: 'TAP the weeds as they sprout!', dur: 5.5, bg: '#dcf5c8', unit: 'weeds', max: 12,
  start() {
    const a = pa(); this.holes = []; const cols = 3, rows = 3; const cw = a.w / cols, ch = (a.h - 40) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) this.holes.push({ x: a.x + cw * (c + 0.5), y: a.y + 40 + ch * (r + 0.5) + 20, weed: null });
    this.n = 0; this.spawn = 0.25; this.t = 0; this.missed = 0;
  },
  update(dt) {
    this.t += dt; this.spawn -= dt;
    if (this.spawn <= 0) {
      this.spawn = R(0.3, 0.55) * (1 - clamp(this.t / this.dur, 0, 1) * 0.35);
      const empty = this.holes.filter(h => !h.weed); if (empty.length) { const h = pick(empty); h.weed = { t: 0, life: R(1.1, 1.5), col: pick(['#6fcf5a', '#8fd977', '#57b84a']), flower: pick(['#ff8ac2', '#ffd23f', '#c79cff', null]) }; }
    }
    for (const h of this.holes) if (h.weed) { h.weed.t += dt; if (h.weed.t > h.weed.life) { FX.puff(h.x, h.y - 40, '#fff', 5); this.missed++; h.weed = null; } }
  },
  down(p) {
    for (const h of this.holes) if (h.weed && dist(p.x, p.y, h.x, h.y - 38) < 58) {
      h.weed = null; this.n++; AU.pop(); FX.spark(h.x, h.y - 30, '#9ef29e', 12); FX.spark(h.x, h.y, '#8b5a3c', 6, 150); FX.text(h.x, h.y - 80, '+1', '#fff'); return;
    }
    FX.puff(p.x, p.y, 'rgba(0,0,0,0.12)', 3);
  },
  move() {}, up() {},
  draw() {
    for (const h of this.holes) {
      ellipse(h.x, h.y, 48, 20); ctx.fillStyle = '#8b5a3c'; ctx.fill(); ellipse(h.x, h.y - 4, 40, 14); ctx.fillStyle = '#5c3a26'; ctx.fill();
      const w = h.weed; if (!w) continue;
      const grow = easeOutBack(w.t / 0.35); const wilt = w.t > w.life - 0.35 ? (w.t - (w.life - 0.35)) / 0.35 : 0;
      ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(wilt * 0.5 + Math.sin(this.t * 6 + h.x) * 0.06);
      ctx.scale(grow, grow);
      const hgt = 70;
      ctx.strokeStyle = '#3f8f3a'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(6, -hgt / 2, 0, -hgt); ctx.stroke();
      ctx.fillStyle = w.col; ellipse(-18, -hgt * 0.45, 18, 9, -0.6); ctx.fill(); ellipse(18, -hgt * 0.6, 18, 9, 0.6); ctx.fill();
      circle(0, -hgt - 14, 26); ctx.fillStyle = w.col; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      if (w.flower) { ctx.fillStyle = w.flower; for (let i = 0; i < 5; i++) { circle(Math.cos(i / 5 * TAU) * 11, -hgt - 40 + Math.sin(i / 5 * TAU) * 11, 7); ctx.fill(); } ctx.fillStyle = '#ffd23f'; circle(0, -hgt - 40, 6); ctx.fill(); }
      face(0, -hgt - 12, 20, wilt ? 'sleepy' : 'happy');
      ctx.restore();
    }
  },
  result() { return { value: this.n, label: this.n + (this.n === 1 ? ' weed' : ' weeds'), pct: clamp(this.n / this.max, 0, 1) }; },
});

// 5. PANCAKE FLIP — timing! flip when golden
GAMES.push({
  id: 'pancake', name: 'PANCAKE FLIP', emoji: '🥞', verb: 'TAP!', gesture: 'tap', hint: 'TAP when the pancake turns golden!', dur: 6, bg: '#ffe7c7', unit: 'flips', max: 4,
  start() { this.stack = 0; this.t = 0; this.msg = ''; this.msgT = 0; this.smoke = 0; this.newCake(); },
  newCake() { this.cook = 0; this.speed = R(0.5, 0.85); this.state = 'cook'; this.ft = 0; this.good = false; },
  update(dt) {
    this.t += dt; this.msgT -= dt;
    if (this.state === 'cook') { this.cook += this.speed * dt; if (this.cook >= 1.06) { this.state = 'burnt'; this.ft = 0; AU.bad(); this.msg = 'BURNT!'; this.msgT = 0.6; shake(0.2); this.smoke = 1; } }
    else { this.ft += dt; if (this.ft > (this.state === 'flip' ? 0.5 : 0.55)) this.newCake(); }
    this.smoke = Math.max(0, this.smoke - dt);
    if (this.smoke > 0 && Math.random() < 0.3) FX.puff(W / 2 + R(-30, 30), this.py - 60, 'rgba(90,90,90,0.5)', 1);
  },
  down() {
    if (this.state !== 'cook') return; const c = this.cook; this.state = 'flip'; this.ft = 0;
    if (c >= 0.52 && c <= 0.86) { this.good = true; this.stack++; AU.great(); this.msg = 'PERFECT!'; this.msgT = 0.6; FX.spark(W / 2, this.py, '#ffd23f', 14); }
    else if (c < 0.52) { AU.splat(); this.msg = 'too early!'; this.msgT = 0.6; FX.puff(W / 2, this.py, '#ffe9b8', 5); }
    else { AU.bad(); this.msg = 'too late!'; this.msgT = 0.6; }
  },
  move() {}, up() {},
  draw() {
    const a = pa(), cx = a.x + a.w / 2, cy = a.y + a.h * 0.5; this.py = cy;
    // stove ring meter
    ctx.save(); ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.arc(cx, cy, 128, -Math.PI / 2, -Math.PI / 2 + TAU * 0.999); ctx.stroke();
    ctx.strokeStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(cx, cy, 128, -Math.PI / 2 + TAU * 0.52, -Math.PI / 2 + TAU * 0.86); ctx.stroke();
    ctx.strokeStyle = '#ff8a5b'; ctx.beginPath(); ctx.arc(cx, cy, 128, -Math.PI / 2 + TAU * 0.86, -Math.PI / 2 + TAU * 0.999); ctx.stroke();
    const ang = -Math.PI / 2 + TAU * clamp(this.cook, 0, 1); ctx.fillStyle = INK; circle(cx + Math.cos(ang) * 128, cy + Math.sin(ang) * 128, 10); ctx.fill();
    ctx.restore();
    // pan (handle toward the active hand)
    ctx.save(); ctx.translate(cx, cy); if (S.hand === 'L') ctx.scale(-1, 1);
    ctx.fillStyle = '#4b4b58'; ctx.strokeStyle = INK; ctx.lineWidth = 4; rr(80, -14, 90, 28, 14); ctx.fill(); ctx.stroke();
    circle(0, 0, 100); ctx.fillStyle = '#5a5a68'; ctx.fill(); ctx.stroke(); circle(0, 0, 84); ctx.fillStyle = '#3d3d49'; ctx.fill();
    ctx.restore();
    // pancake
    const cook = clamp(this.cook, 0, 1.1);
    let col; if (cook < 0.52) col = mixCol('#fff1cf', '#f2c46b', cook / 0.52); else if (cook < 0.86) col = mixCol('#f2c46b', '#d9924a', (cook - 0.52) / 0.34); else col = mixCol('#d9924a', '#4a2c1e', clamp((cook - 0.86) / 0.2, 0, 1));
    let oy = 0, sy = 1; if (this.state === 'flip') { const k = this.ft / 0.5; oy = -Math.sin(k * Math.PI) * 150; sy = Math.abs(Math.cos(k * Math.PI)); }
    ctx.save(); ctx.translate(cx, cy + oy); ctx.scale(1, Math.max(0.08, sy));
    ellipse(0, 0, 70, 70); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    if (this.state !== 'burnt') face(0, 0, 26, cook > 0.86 ? 'dizzy' : cook > 0.52 ? 'joy' : 'sleepy'); else face(0, 0, 26, 'dizzy');
    ctx.restore();
    // plate with stack
    const px = S.hand === 'L' ? a.x + a.w - 90 : a.x + 90, pyy = a.y + a.h - 50;
    ellipse(px, pyy, 62, 18); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
    for (let i = 0; i < this.stack; i++) { ellipse(px, pyy - 8 - i * 12, 44, 12); ctx.fillStyle = '#e8a44b'; ctx.fill(); ctx.stroke(); }
    if (this.stack) { txt('🧈', px, pyy - 20 - this.stack * 12, 22); }
    if (this.msgT > 0) txt(this.msg, cx, cy - 175, 36, { color: this.msg === 'PERFECT!' ? '#ffd23f' : '#fff', stroke: INK });
  },

/* =====================================================================
   PLAYER NAME + GLOBAL HIGH SCORES (Netlify DB via /api/scores)
   Scores go into a persistent outbox (localStorage) the moment a round ends,
   then flush asynchronously with retry/backoff, sendBeacon on page hide and
   re-flush on reload. Client-generated ids make every send idempotent, so
   nothing is ever lost or double counted.
   ===================================================================== */

const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
const cleanName = v => String(v || '').replace(/[\x00-\x1f\x7f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12);
const NET = {
  url: '/api/scores', name: '', board: null, status: 'idle', // idle | loading | synced | saving | offline
  outbox: [], flushing: false, backoff: 1500, timer: null, pb: {}, sessionRecords: 0,
  load() {
    this.name = ''; this.pb = {}; this.outbox = store.get('ham.outbox', []); this.board = store.get('ham.board', null);
    if (!Array.isArray(this.outbox)) this.outbox = [];
    this.refresh(); this.flush();
  },
  setName(n) { this.name = cleanName(n) || 'Champ'; this.pb = store.get('ham.pb.' + this.name.toLowerCase(), {}); },
  clearName() { this.name = ''; this.pb = {}; },
  setBoard(b) { if (b && b.games) { this.board = { games: b.games, ts: b.ts || Date.now() }; store.set('ham.board', this.board); } },
  async refresh() {

  best(gid) { return this.top(gid)[0] || null; },
  // called at the end of every round; returns { world, personal } flags for the celebration
  record(game, hand, res) {

    const personal = res.value > 0 && res.value > (this.pb[game.id] || 0);
    if (personal) { this.pb[game.id] = res.value; store.set('ham.pb.' + this.name.toLowerCase(), this.pb); }
    if (world) this.sessionRecords++;

    this.outbox.push(entry); store.set('ham.outbox', this.outbox);

  handTally() { let L = 0, R = 0; for (const g of GAMES) { const b = this.best(g.id); if (b) { if (b.hand === 'L') L++; else R++; } } return { L, R }; },
  statusLabel() { return { idle: '', loading: '🌍 loading records…', synced: '🌍 world records synced', saving: '⏳ saving score…', offline: '📡 offline · will retry' }[this.status] || ''; },
};
const nameBox = document.getElementById('namebox'), nameInput = document.getElementById('nameinput');
function askName(prefill) { nameInput.value = prefill || ''; nameBox.hidden = false; setTimeout(() => { try { nameInput.focus(); } catch (_) {} }, 50); }
document.getElementById('nameform').addEventListener('submit', e => { e.preventDefault(); NET.setName(nameInput.value); nameBox.hidden = true; nameInput.blur(); AU.init(); AU.great(); startSession(); });

/* =====================================================================
   SESSION / STATE MACHINE
   ===================================================================== */
const S = {
  state: 'title', t: 0, beat: 0,
  games: [], gi: 0, half: 0, hand: 'L', firstHand: 'L', game: null,
  scores: {}, results: [], cd: null, goT: 0, buttons: [], stateT: 0, tally: null, lastRound: null, titleT: 0, revealed: 0, champShown: false, rec: null, rows: [], viewGame: null, hintT: 0, gotIt: false, nudge: null,

function setState(s) { S.state = s; S.t = 0; S.beat = 0; }
function curGame() { return S.games[S.gi]; }

function roundIndex() { return S.half * S.games.length + S.gi; }
function bpmFor(ri) { return 130 + ri * 3; }

function startSession(ids) {
  S.games = ids ? ids.map(id => GAMES.find(g => g.id === id)) : shuffle(GAMES).slice(0, GAMES_PER_SESSION);
  S.startedAt = performance.now(); NET.sessionRecords = 0;
  S.gi = 0; S.half = 0; S.results = []; S.scores = {}; S.tally = null;
  S.firstHand = Math.random() < 0.5 ? 'L' : 'R'; S.hand = S.firstHand; FX.list.length = 0;
  Metro.start(bpmFor(0));
  beginRound();
}
function goHome() { NET.clearName(); S.tally = null; S.results = []; FX.list.length = 0; Metro.stop(); setState('title'); }
function beginRound() {
  S.game = curGame(); S.cd = null; Metro.bpm = bpmFor(roundIndex()); setState('countdown');
}
// what the other hand scored on this game (second half only)
function rivalScore() { return S.half === 1 ? (S.scores[S.game.id] || {})[otherHand(S.hand)] : null; }
function beginPlay() { S.game.start(); S.goT = 0.6; S.hintT = 2.8; S.gotIt = false; S.nudge = null; G.down = false; G.lastNudge = -9; setState('play'); }
// gesture watcher: is the player touching the way this game needs?
const G = { down: false, sx: 0, sy: 0, px: 0, py: 0, moved: 0, t0: 0, warned: false, lastNudge: -9 };
const TAPPY = k => k === 'tap' || k === 'tapfast';
const NUDGE = { tap: 'just TAP it! 👆', tapfast: 'TAP TAP TAP — no dragging!', swipe: 'SWIPE across it! 👉', trace: 'hold & TRACE the line ✂️', drag: 'hold & DRAG it ✋', rub: 'RUB side to side ↔' };
function nudge() {
  if (S.t - G.lastNudge < 1.6) return; G.lastNudge = S.t;
  S.nudge = { text: NUDGE[S.game.gesture], t: 1.5 }; S.gotIt = false; S.hintT = Math.max(S.hintT, 1.8);

}
function gestureDown(p) { G.down = true; G.sx = G.px = p.x; G.sy = G.py = p.y; G.moved = 0; G.t0 = S.t; G.warned = false; }
function gestureMove(p) {
  if (!G.down) return; G.moved += dist(p.x, p.y, G.px, G.py); G.px = p.x; G.py = p.y; const k = S.game.gesture;
  if (TAPPY(k)) { if (G.moved > 45 && !G.warned) { G.warned = true; nudge(); } }

}
function gestureUp() {
  if (!G.down) return; G.down = false; const k = S.game.gesture, isTap = G.moved < 14 && S.t - G.t0 < 0.35;
  if (TAPPY(k)) { if (isTap) S.gotIt = true; }

}
function endPlay() {
  const res = S.game.result(); (S.scores[S.game.id] = S.scores[S.game.id] || {})[S.hand] = res; S.lastRound = res; S.game.up({ x: 0, y: 0 }); activeId = null;
  S.rec = NET.record(S.game, S.hand, res);   // queue the score for the world board (async, never blocks)
  if (S.rec.world) { AU.fanfare(); FX.confetti(60); } else if (S.rec.personal) AU.great(); else if (res.pct >= 0.8) AU.great(); else if (res.pct >= 0.4) AU.good(); else AU.bad();

}
function afterRoundEnd() {
  S.gi++;

  if (S.half === 0) { S.half = 1; S.gi = 0; S.hand = otherHand(S.firstHand); AU.jingle(true); setState('halftime'); return; }
  finishSession();
}
function finishSession() {
  S.results = S.games.map(g => { const L = S.scores[g.id].L, Rr = S.scores[g.id].R; return { game: g, L, R: Rr, winner: L.value > Rr.value ? 'L' : Rr.value > L.value ? 'R' : 'T' }; });

  for (const r of S.results) { if (r.winner === 'L') wl++; else if (r.winner === 'R') wr++; pl += r.L.pct; pr += r.R.pct; }
  let champ = wl > wr ? 'L' : wr > wl ? 'R' : pl > pr + 0.001 ? 'L' : pr > pl + 0.001 ? 'R' : 'T';
  S.tally = { wl, wr, champ, secs: (performance.now() - S.startedAt) / 1000 }; S.revealed = 0; S.champShown = false;

// final-screen reveal timing: rows pop in one by one, then the champion
const REVEAL_START = 0.7, REVEAL_STEP = 0.5;
function champAt() { return REVEAL_START + S.results.length * REVEAL_STEP + 0.6; }

function onBeat() {
  S.beat++;
  if (S.state === 'countdown') {
    if (S.beat === 1) { S.cd = 3; AU.count(3); }
    else if (S.beat === 2) { S.cd = 2; AU.count(2); }
    else if (S.beat === 3) { S.cd = 1; AU.count(1); }
    else if (S.beat >= 4) { AU.count(0); beginPlay(); }
  } else if (S.state === 'roundEnd') { if (S.beat >= 2) afterRoundEnd(); }
  else if (S.state === 'halftime') { if (S.beat === 2 || S.beat === 4) AU.pop(); else if (S.beat >= 7) beginRound(); }
}

// ---------- input ----------
let activeId = null;
const ptr = e => ({ x: e.clientX, y: e.clientY });
canvas.addEventListener('pointerdown', e => {
  e.preventDefault(); AU.init();
  if (activeId !== null) return; activeId = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  onDown(ptr(e));
}, { passive: false });
canvas.addEventListener('pointermove', e => { if (e.pointerId !== activeId) return; onMove(ptr(e)); });
const endH = e => { if (e.pointerId !== activeId) return; activeId = null; onUp(ptr(e)); };
canvas.addEventListener('pointerup', endH); canvas.addEventListener('pointercancel', endH);
canvas.addEventListener('lostpointercapture', e => { if (e.pointerId === activeId) { activeId = null; onUp(ptr(e)); } });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

function hitButton(p) { return S.buttons.find(b => Math.abs(p.x - b.x) < b.w / 2 && Math.abs(p.y - b.y) < b.h / 2); }
function onDown(p) {
  const b = hitButton(p);
  if (S.state === 'title') {
    if (S.t < 0.3 || !b) return;
    if (b.id === 'play') { AU.pop(); askName(''); }
    else if (b.id === 'records') { AU.pop(); NET.refresh(); S.viewGame = null; setState('records'); }
  }
  else if (S.state === 'play') { gestureDown(p); S.game.down(p); }
  else if (S.state === 'final') { if (S.champShown && S.t > champAt() + 0.6 && b) { AU.pop(); if (b.id === 'records') { S.viewGame = null; setState('records'); } else goHome(); } }
  else if (S.state === 'records') {
    if (b && b.id === 'back') { AU.pop(); if (S.viewGame) { S.viewGame = null; S.t = 0; } else if (S.tally) goHome(); else setState('title'); return; }
    if (!S.viewGame) { const row = S.rows.find(r => Math.abs(p.y - r.y) < r.h / 2); if (row) { AU.pop(); S.viewGame = row.game; S.t = 0; } }
  }
}
function onMove(p) { if (S.state === 'play') { gestureMove(p); S.game.move(p); } }
function onUp(p) { if (S.state === 'play') { gestureUp(); S.game.up(p); } }

// ---------- update / draw ----------
function update(dt) {
  S.t += dt; S.titleT += dt; FX.update(dt); shakeT = Math.max(0, shakeT - dt);
  if (S.state === 'play') { S.goT -= dt; S.hintT -= dt; if (S.nudge) S.nudge.t -= dt; S.game.update(dt); if (S.t >= S.game.dur) endPlay(); }
  if (S.state === 'final') {
    const n = S.results.length, k = Math.min(n, Math.floor((S.t - REVEAL_START) / REVEAL_STEP) + 1);
    while (S.revealed < k) { const r = S.results[S.revealed++]; if (r.winner === 'T') AU.pop(); else AU.good(); }
    if (!S.champShown && S.t >= champAt()) { S.champShown = true; AU.fanfare(); FX.confetti(140); }
  }

function drawBackground(col) {

  ctx.save(); ctx.fillStyle = 'rgba(255,255,255,0.35)';
  const sp = 64, off = (S.titleT * 20) % sp;
  for (let y = -sp; y < H + sp; y += sp) for (let x = -sp; x < W + sp; x += sp) { const r = 5 + pulse * 5 + Math.sin((x + y) * 0.02 + S.titleT * 2) * 2; circle(x + off + ((y / sp) % 2) * sp / 2, y + off, r); ctx.fill(); }
  ctx.restore();
}

  }
  bigButton(cx, H * 0.92 - BOT, Math.min(200, W * 0.5), 52, '◀ BACK', '#7ed6ff', 'back');
  txt(NET.statusLabel(), cx, H * 0.92 - BOT + 40, 12, { color: INK, weight: 500, alpha: 0.6 });
}

function drawCountdown() {
  const g = S.game, hc = HAND_COL[S.hand]; drawBackground(g.bg); drawHandGlow(S.hand, 0.55);
  const k = easeOutBack(S.t / 0.35), cx = W / 2; const cw = Math.min(W - 40, 360), ch = Math.min(300, H * 0.38); const cy = TOP + H * 0.06 + ch / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
  rr(-cw / 2, -ch / 2 + 8, cw, ch, 30); ctx.fillStyle = INK; ctx.fill(); rr(-cw / 2, -ch / 2, cw, ch, 30); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  txt(g.emoji + '  ' + g.name, 0, -ch / 2 + 36, Math.min(28, cw * 0.075), { color: hc, stroke: INK });
  // the MAINLINE: how you touch, big and animated
  const gc = GCOL[g.gesture], dy = -ch / 2 + ch * 0.47;
  gestureDemo(g.gesture, -cw * 0.24, dy, S.titleT, Math.min(48, cw * 0.14));
  const vs = Math.min(44, cw * 0.12 * (g.verb.length > 5 ? 0.62 : 1)); const pw = Math.min(cw * 0.46, 190), vp = 1 + Metro.pulse() * 0.08;
  ctx.save(); ctx.translate(cw * 0.22, dy); ctx.scale(vp, vp); rr(-pw / 2, -30, pw, 60, 30); ctx.fillStyle = gc; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  txt(g.verb, 0, 1, vs, { color: '#fff', stroke: INK, strokeW: vs * 0.2 }); ctx.restore();
  wrapText(g.hint, 0, ch / 2 - 62, cw - 40, 16, INK);
  const rv = rivalScore();
  if (rv) txt(HAND_NAME[otherHand(S.hand)] + ' got ' + rv.label + ' — beat it!', 0, ch / 2 - 22, 14, { color: HAND_COL[otherHand(S.hand)], weight: 700 });
  else txt('Game ' + (S.gi + 1) + ' of ' + S.games.length, 0, ch / 2 - 22, 14, { color: INK, weight: 500, alpha: 0.7 });
  ctx.restore();
  // hand call
  const hy = H * 0.66; const pulse = Metro.pulse(); const hs = 1 + pulse * 0.12;
  hand(cx + (S.hand === 'L' ? -1 : 1) * Math.min(120, W * 0.28), hy, 60 * hs, S.hand, 'joy', hc, Math.sin(S.titleT * 8) * 0.12);
  txt(HAND_NAME[S.hand] + ' HAND!', cx + (S.hand === 'L' ? 1 : -1) * Math.min(50, W * 0.12), hy, Math.min(40, W * 0.09), { color: hc, stroke: INK });
  // count number
  if (S.cd !== null) { const bs = easeOutBack(Metro.sinceBeat() / 0.3); txt(String(S.cd), cx, H * 0.86, 90 * bs, { color: '#ffd23f', stroke: INK, rot: (S.cd % 2 ? 1 : -1) * 0.1 }); }
  else txt('get ready…', cx, H * 0.86, 24, { color: '#fff', stroke: INK });
}
function wrapText(s, x, y, maxW, size, col) {
  ctx.save(); ctx.font = `500 ${size}px ${FONT}`; const words = s.split(' '); let line = '', lines = [];
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); ctx.restore();
  lines.forEach((l, i) => txt(l, x, y + i * (size + 6), size, { color: col, weight: 500 }));
}

function drawPlay() {
  const g = S.game; drawBackground(g.bg);
  ctx.save(); if (shakeT > 0) ctx.translate(R(-1, 1) * shakeT * 24, R(-1, 1) * shakeT * 24);
  g.draw(); FX.draw(); ctx.restore();
  drawHUD();
  const gc = GCOL[g.gesture], a = pa();
  if (S.hintT > 0 && !S.gotIt) {
    const al = clamp(S.hintT / 0.4, 0, 1), pulse = 1 + Metro.pulse() * 0.1;
    txt(g.verb, W / 2, a.y + 58, Math.min(56, W * 0.14) * pulse, { color: gc, stroke: INK, alpha: al, rot: Math.sin(S.titleT * 6) * 0.04 });
    gestureDemo(g.gesture, W / 2, a.y + a.h * 0.46, S.titleT, Math.min(64, W * 0.16), 0.92 * al);
  }
  if (S.goT > 0) { const k = S.goT > 0.4 ? easeOutBack((0.6 - S.goT) / 0.2) : S.goT / 0.4; txt('GO!', W / 2, H / 2, 110 * k, { color: HAND_COL[S.hand], stroke: INK, rot: -0.1 }); }
  if (S.t < 2.2) { txt(g.hint, W / 2, H - 46 - BOT, 19, { color: '#fff', stroke: INK, alpha: clamp(2.2 - S.t, 0, 1) }); }
  if (S.nudge && S.nudge.t > 0) {
    const k = easeOutBack((1.5 - S.nudge.t) / 0.25), al = clamp(S.nudge.t / 0.3, 0, 1); ctx.save(); ctx.globalAlpha = al;
    ctx.translate(W / 2, a.y + 118); ctx.scale(k, k); ctx.rotate(Math.sin(S.titleT * 18) * 0.03);
    ctx.font = `700 19px ${FONT}`; const tw = ctx.measureText(S.nudge.text).width + 44;
    rr(-tw / 2, -22, tw, 44, 22); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = gc; ctx.stroke();
    txt(S.nudge.text, 0, 1, 19, { color: INK }); ctx.restore();
  }
}
function drawRoundEnd() {
  const g = S.game; drawBackground(g.bg); ctx.save(); ctx.globalAlpha = 0.5; g.draw(); ctx.restore(); FX.draw(); drawHUD();
  const res = S.lastRound, hc = HAND_COL[S.hand]; const k = easeOutBack(S.t / 0.3);
  const rec = S.rec || {}, extra = rec.world || rec.personal ? 48 : 0;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(k, k);
  rr(-Math.min(W - 40, 340) / 2, -90, Math.min(W - 40, 340), 180 + extra, 30); ctx.fillStyle = '#fff'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  if (extra) txt(rec.world ? '🌍 NEW WORLD RECORD!' : '⭐ new personal best!', 0, 108, rec.world ? 24 : 20, { color: rec.world ? '#ffd23f' : '#c79cff', stroke: INK, rot: Math.sin(S.titleT * 10) * 0.05 });
  txt(HAND_NAME[S.hand] + ' HAND', 0, -50, 22, { color: hc, stroke: INK });
  txt(res.label, 0, 6, Math.min(44, W * 0.1), { color: '#ffd23f', stroke: INK });
  const rv = rivalScore();
  if (rv) { const d = res.value - rv.value; txt(d > 0 ? 'beat ' + HAND_NAME[otherHand(S.hand)] + '\'s ' + rv.value + '! 🎉' : d < 0 ? HAND_NAME[otherHand(S.hand)] + ' had ' + rv.value + '… 😅' : 'tied with ' + HAND_NAME[otherHand(S.hand)] + '! 🤝', 0, 56, 20, { color: d > 0 ? hc : INK, weight: 700 }); }
  else txt(res.pct >= 0.8 ? 'AMAZING!!' : res.pct >= 0.5 ? 'nice!' : res.pct >= 0.25 ? 'not bad!' : 'oof, wobbly!', 0, 56, 22, { color: INK, weight: 500 });
  ctx.restore();
}
function drawHalftime() {
  const from = S.firstHand, to = S.hand; drawBackground('#fff3b0'); drawHandGlow(to, 0.45 + Metro.pulse() * 0.2);
  const cx = W / 2, cy = H * 0.42, k = easeOutBack(S.t / 0.4);
  txt('HALFTIME!', cx, TOP + H * 0.14, Math.min(48, W * 0.12) * k, { color: '#ffd23f', stroke: INK, rot: Math.sin(S.titleT * 4) * 0.06 });
  txt(HAND_NAME[from] + ' hand is done. Shake it out!', cx, TOP + H * 0.14 + 46, Math.min(18, W * 0.046), { color: INK, weight: 500 });
  // tired hand slumps off, fresh hand bounces in
  const slide = easeOut(S.t / 0.8); const gap = Math.min(110, W * 0.26);
  hand(cx - gap - slide * 40, cy + slide * 20, Math.min(80, W * 0.18) * (1 - slide * 0.3), from, 'sleepy', HAND_COL[from], slide * 0.4);
  const bounce = Math.abs(Math.sin(S.titleT * 7)) * 20;
  hand(cx + gap, cy - bounce, Math.min(96, W * 0.22) * k, to, 'joy', HAND_COL[to], Math.sin(S.titleT * 9) * 0.15);
  txt('💤', cx - gap + 50, cy - 70 - slide * 10, 30);
  txt('✨', cx + gap + 60, cy - 90 - bounce, 30);
  const bs = 1 + Metro.pulse() * 0.1;
  txt('SWITCH TO YOUR', cx, H * 0.66, Math.min(24, W * 0.06), { color: '#fff', stroke: INK });
  txt(HAND_NAME[to] + ' HAND!', cx, H * 0.66 + 52, Math.min(46, W * 0.11) * bs, { color: HAND_COL[to], stroke: INK });
  txt('same ' + S.games.length + ' games · beat ' + HAND_NAME[from] + '\'s scores!', cx, H * 0.84, 17, { color: INK, weight: 500, alpha: 0.75 });
  FX.draw();
}
function drawFinal() {
  const t = S.tally, done = S.champShown; S.buttons = [];
  drawBackground(!done ? '#fff3b0' : t.champ === 'T' ? '#fff3b0' : t.champ === 'L' ? '#d6ecff' : '#ffdcef');
  if (done && t.champ !== 'T') drawHandGlow(t.champ, 0.5);
  const cx = W / 2; const k = easeOutBack((S.t - champAt()) / 0.5);
  const hy = TOP + H * 0.27; const bounce = Math.abs(Math.sin(S.titleT * 6)) * 12; const hs = Math.min(84, H * 0.1);
  if (!done) {
    txt('THE RESULTS!', cx, TOP + H * 0.055, Math.min(32, W * 0.078), { color: '#fff', stroke: INK });
    // both hands waiting nervously
    const gap = Math.min(90, W * 0.22);
    hand(cx - gap, hy + Math.sin(S.titleT * 12) * 3, hs * 0.85, 'L', 'o', HAND_COL.L, Math.sin(S.titleT * 14) * 0.05);
    hand(cx + gap, hy + Math.cos(S.titleT * 12) * 3, hs * 0.85, 'R', 'o', HAND_COL.R, -Math.sin(S.titleT * 14) * 0.05);
    txt('VS', cx, hy, 30, { color: '#ffd23f', stroke: INK });
  } else {
    const nm = NET.name.toUpperCase();
    const head = t.champ === 'T' ? (nm ? 'BOTH HANDS WIN, ' + nm + '!' : 'BOTH HANDS WIN!') : (nm ? nm + (/S$/.test(nm) ? "' " : "'S ") : '') + 'CHAMPION HAND!';
    txt(head, cx, TOP + H * 0.055, Math.min(32, W * 0.078, (W - 30) / head.length * 1.85), { color: '#fff', stroke: INK });
    if (t.champ === 'T') { hand(cx - 70, hy, hs * 0.8 * k, 'L', 'joy', HAND_COL.L, Math.sin(S.titleT * 8) * 0.15); hand(cx + 70, hy, hs * 0.8 * k, 'R', 'joy', HAND_COL.R, -Math.sin(S.titleT * 8) * 0.15); txt('🤝', cx, hy - hs * 1.3, 50); }
    else { hand(cx, hy - bounce, hs * k, t.champ, 'joy', HAND_COL[t.champ], Math.sin(S.titleT * 8) * 0.15); txt('👑', cx, hy - hs * 1.45 - bounce, 56 * k, { rot: Math.sin(S.titleT * 5) * 0.15 }); }
  }
  // running tally (counts up as rows reveal)
  let wl = 0, wr = 0; for (let i = 0; i < S.revealed; i++) { const w = S.results[i].winner; if (w === 'L') wl++; else if (w === 'R') wr++; }
  if (done) txt(t.champ === 'T' ? `${t.wl} – ${t.wr}  perfectly even!` : `${HAND_NAME[t.champ]} HAND  ${Math.max(t.wl, t.wr)} – ${Math.min(t.wl, t.wr)}`, cx, TOP + H * 0.375, Math.min(30, W * 0.07), { color: t.champ === 'T' ? INK : HAND_COL[t.champ], stroke: t.champ === 'T' ? '#fff' : INK });
  else txt(`LEFT ${wl}  ·  ${wr} RIGHT`, cx, TOP + H * 0.375, Math.min(26, W * 0.065), { color: '#fff', stroke: INK });
  // results list, one row per game, revealed one at a time
  const lw = Math.min(W - 30, 380), ly = TOP + H * 0.42, rh = Math.min(38, (H * 0.36) / S.results.length);
  ctx.save(); rr(cx - lw / 2, ly, lw, rh * S.results.length + 16, 22); ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  S.results.forEach((r, i) => {
    const y = ly + 8 + rh * i + rh / 2; if (i >= S.revealed) return;
    const rk = easeOutBack((S.t - REVEAL_START - i * REVEAL_STEP) / 0.3);
    txt(r.game.emoji, cx - lw / 2 + 28, y, 22 * rk); txt(r.game.name, cx - lw / 2 + 50, y, 15, { align: 'left', color: INK });
    txt(String(r.L.value), cx + lw / 2 - 110, y, 20 * rk, { color: HAND_COL.L, stroke: INK, strokeW: 4, weight: 700 });
    txt(String(r.R.value), cx + lw / 2 - 30, y, 20 * rk, { color: HAND_COL.R, stroke: INK, strokeW: 4 });
    txt(r.winner === 'T' ? '🤝' : '👑', cx + lw / 2 - (r.winner === 'L' ? 140 : r.winner === 'R' ? 60 : 70), y, 16 * rk);
  });
  ctx.restore();
  if (done) {
    if (NET.sessionRecords) txt(`🌍 ${NET.sessionRecords} NEW WORLD RECORD${NET.sessionRecords > 1 ? 'S' : ''}!`, cx, TOP + H * 0.81, Math.min(22, W * 0.055), { color: '#ffd23f', stroke: INK, rot: Math.sin(S.titleT * 6) * 0.04 });
    bigButton(cx - Math.min(70, W * 0.18), H * 0.9 - BOT, Math.min(190, W * 0.5), 62, '🏠 HOME', '#ff5c8a', 'home');
    bigButton(cx + Math.min(120, W * 0.32), H * 0.9 - BOT, Math.min(100, W * 0.26), 62, '🌍', '#c79cff', 'records');
    txt(NET.statusLabel(), cx, H * 0.9 - BOT + 46, 12, { color: INK, weight: 500, alpha: 0.6 });
  }
  FX.draw();
}

function draw() {
  ctx.save();
  switch (S.state) {
    case 'title': drawTitle(); break;
    case 'countdown': drawCountdown(); FX.draw(); break;
    case 'play': drawPlay(); break;
    case 'roundEnd': drawRoundEnd(); break;
    case 'halftime': drawHalftime(); break;
    case 'final': drawFinal(); break;
    case 'records': drawRecords(); break;
  }
  ctx.restore();
}

// ---------- main loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const beats = Metro.update(); for (let i = 0; i < beats; i++) onBeat();
  update(dt); draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) document.fonts.load('700 20px Fredoka').catch(() => {});
// expose for testing / tinkering
NET.load();
window.HAM = { S, GAMES, Metro, AU, NET, startSession, askName, gestureDemo };
</script>
